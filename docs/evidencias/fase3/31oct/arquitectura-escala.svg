<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="864" viewBox="0 0 1536 864" role="img" aria-labelledby="title desc">
  <title id="title">TrazIA-3D: arquitectura de escala y revisión</title>
  <desc id="desc">Documentos con hash pasan por API, caché, Redis, workers CPU y validación IFC DRAFT. Revisión humana, auditoría y aprendizaje aprobado cierran el circuito. El lote sintético tiene 173 DRAFT y 163 errores; no demuestra 1600 IFC válidos.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#5cc4ff" stroke-width="1.5"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#f5f5f5}
      .card{fill:#111;stroke:#383838;stroke-width:1.2}
      .heading{font-size:23px;font-weight:600}
      .body{font-size:18px;fill:#ccc}
      .small{font-size:16px;fill:#aaa}
      .accent{fill:#5cc4ff}
      .line{fill:none;stroke:#5cc4ff;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1536" height="864" fill="#050505"/>
  <text x="48" y="82" font-size="49" font-weight="650" letter-spacing="-1.4">TrazIA<tspan class="accent">-3D</tspan></text>
  <text x="48" y="131" font-size="26" fill="#ccc">Escala con trazabilidad y revisión humana</text>
  <text x="48" y="170" class="small">Arquitectura implementada · inferencia del lote en CPU · resultados sintéticos</text>

  <path class="line" d="M258 300H292"/><path class="line" d="M502 300H536"/>
  <path class="line" d="M746 300H780"/><path class="line" d="M990 300H1024"/>
  <path class="line" d="M1234 300H1268"/>
  <path class="line" d="M641 230V206H1373V230"/>
  <text x="886" y="195" class="small">Acierto: reutiliza un resultado verificado</text>

  <rect x="48" y="230" width="210" height="140" rx="14" class="card"/>
  <text x="68" y="267" class="heading">Documentos</text>
  <text x="68" y="304" class="body">PDF + hoja de datos</text>
  <text x="68" y="340" class="small accent">SHA-256</text>

  <rect x="292" y="230" width="210" height="140" rx="14" class="card"/>
  <text x="312" y="267" class="heading">API</text>
  <text x="312" y="304" class="body">ETag · idempotencia</text>
  <text x="312" y="340" class="small">Progreso por SSE</text>

  <rect x="536" y="230" width="210" height="140" rx="14" class="card"/>
  <text x="556" y="267" class="heading">Caché por hash</text>
  <text x="556" y="304" class="body">Datos + configuración</text>
  <text x="556" y="340" class="small">Calibración + fusión</text>

  <rect x="780" y="230" width="210" height="140" rx="14" class="card"/>
  <text x="800" y="267" class="heading">Cola durable</text>
  <text x="800" y="304" class="body">Redis / arq</text>
  <text x="800" y="340" class="small">Trabajos persistidos</text>

  <rect x="1024" y="230" width="210" height="140" rx="14" class="card"/>
  <text x="1044" y="267" class="heading">Workers CPU</text>
  <text x="1044" y="304" class="body">B / D sin visión</text>
  <text x="1044" y="340" class="small">Fallos conservados</text>

  <rect x="1268" y="230" width="210" height="140" rx="14" class="card"/>
  <text x="1288" y="267" class="heading">IFC DRAFT</text>
  <text x="1288" y="304" class="body">Contrato + EXPRESS</text>
  <text x="1288" y="340" class="small">Sin aprobar</text>

  <path class="line" d="M1373 370V428H452V490"/>
  <text x="712" y="416" class="small">Revisión de los originales y aprobación ligada a su huella</text>
  <path class="line" d="M612 558H696"/><path class="line" d="M1016 558H1100"/>
  <rect x="292" y="490" width="320" height="136" rx="14" class="card"/>
  <text x="312" y="528" class="heading">Revisión humana</text>
  <text x="312" y="565" class="body">PDF + IFC + campos por riesgo</text>
  <text x="312" y="600" class="small">Aceptar · corregir · rechazar</text>
  <rect x="696" y="490" width="320" height="136" rx="14" class="card"/>
  <text x="716" y="528" class="heading">Auditoría SQL + JSONL</text>
  <text x="716" y="565" class="body">Actor, evidencia y tiempo activo</text>
  <text x="716" y="600" class="small">Deshacer el campo completo</text>
  <rect x="1100" y="490" width="320" height="136" rx="14" class="card"/>
  <text x="1120" y="528" class="heading">Aprendizaje aprobado</text>
  <text x="1120" y="565" class="body">Few-shot en el Copiloto</text>
  <text x="1120" y="600" class="small">Propuesta de recalibración CPU</text>
  <path class="line" stroke-dasharray="7 6" d="M1260 626V662H654V370"/>
  <text x="740" y="681" class="small">Validar las propuestas antes de activarlas</text>
  <text x="48" y="711" class="small">Pendientes: lectura de escaneados, integración de ejemplos en extracción y muestra humana representativa.</text>

  <rect x="48" y="746" width="1430" height="82" rx="14" fill="#111" stroke="#035793"/>
  <text x="72" y="781" font-size="24" font-weight="600">173 IFC DRAFT / 336 revisiones · 163 errores · <tspan class="accent">1,76× con cuatro workers</tspan></text>
  <text x="72" y="812" class="small">133 LOD 2 + 40 LOD 1 · host compartido · tiempo para 1.600 IFC válidos: sin estimar · medición CPU del 31/10</text>
</svg>
