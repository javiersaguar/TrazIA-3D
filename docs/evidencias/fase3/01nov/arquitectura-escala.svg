<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 790" role="img" aria-labelledby="title desc"><title id="title">TrazIA: arquitectura CPU y feedback aprobado</title><desc id="desc">Documentos pasan por API, caché, Redis y workers con etapas por página. Resultados DRAFT se revisan. Solo aprobación y sesión finalizada alimentan ejemplos y prioridad. No se ha medido revisión humana.</desc><rect width="1370" height="790" fill="#0b0d10"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#86AEE8"/></marker></defs><g font-family="Arial,sans-serif" fill="#F0F4F9"><text x="30" y="42" font-size="25">TrazIA-3D · escala CPU y feedback aprobado</text><text x="30" y="69" font-size="15" fill="#9EABBB">Arquitectura implementada · los resultados sintéticos no certifican precisión de ingeniería</text><rect x="30" y="100" width="290" height="130" rx="10" fill="#11151c" stroke="#344052"/><text x="45" y="131" font-size="18">Originales sintéticos</text><text x="45" y="165" font-size="13" fill="#9EABBB">PDF / HDM</text><text x="45" y="189" font-size="13" fill="#9EABBB">SHA-256 por documento</text><rect x="370" y="100" width="290" height="130" rx="10" fill="#11151c" stroke="#344052"/><text x="385" y="131" font-size="18">API</text><text x="385" y="165" font-size="13" fill="#9EABBB">Idempotencia · ETag · SSE</text><text x="385" y="189" font-size="13" fill="#9EABBB">Offline: fallo explícito</text><rect x="710" y="100" width="290" height="130" rx="10" fill="#11151c" stroke="#344052"/><text x="725" y="131" font-size="18">Caché de trabajo</text><text x="725" y="165" font-size="13" fill="#9EABBB">Documentos + parámetros</text><text x="725" y="189" font-size="13" fill="#9EABBB">Calibración + fusión + feedback</text><rect x="1050" y="100" width="290" height="130" rx="10" fill="#11151c" stroke="#344052"/><text x="1065" y="131" font-size="18">Redis / arq</text><text x="1065" y="165" font-size="13" fill="#9EABBB">Cola durable</text><text x="1065" y="189" font-size="13" fill="#9EABBB">Cancelación y timeout</text><rect x="1050" y="320" width="290" height="130" rx="10" fill="#11151c" stroke="#344052"/><text x="1065" y="351" font-size="18">Workers CPU</text><text x="1065" y="385" font-size="13" fill="#9EABBB">1 o 4 procesos, concurrencia 1</text><text x="1065" y="409" font-size="13" fill="#9EABBB">Sin proveedores de visión</text><rect x="710" y="320" width="290" height="130" rx="10" fill="#11151c" stroke="#344052"/><text x="725" y="351" font-size="18">Etapas por página</text><text x="725" y="385" font-size="13" fill="#9EABBB">Texto · raster · OCR · geometría</text><text x="725" y="409" font-size="13" fill="#9EABBB">Huella / DPI / versión / integridad</text><rect x="370" y="320" width="290" height="130" rx="10" fill="#11151c" stroke="#344052"/><text x="385" y="351" font-size="18">Resultado trazable</text><text x="385" y="385" font-size="13" fill="#9EABBB">Contrato 0.3 + IFC DRAFT</text><text x="385" y="409" font-size="13" fill="#9EABBB">Errores y ausencias conservados</text><rect x="30" y="320" width="290" height="130" rx="10" fill="#11151c" stroke="#344052"/><text x="45" y="351" font-size="18">Revisión humana</text><text x="45" y="385" font-size="13" fill="#9EABBB">PDF / campos / IFC</text><text x="45" y="409" font-size="13" fill="#9EABBB">E.5 pospuesta; sin tiempo medido</text><rect x="30" y="560" width="290" height="130" rx="10" fill="#11151c" stroke="#344052"/><text x="45" y="591" font-size="18">Aprobación vigente</text><text x="45" y="625" font-size="13" fill="#9EABBB">Huella + sesión humana finalizada</text><text x="45" y="649" font-size="13" fill="#9EABBB">Originales verificados</text><rect x="370" y="560" width="290" height="130" rx="10" fill="#11151c" stroke="#344052"/><text x="385" y="591" font-size="18">Feedback de extracción</text><text x="385" y="625" font-size="13" fill="#9EABBB">≤ 3 ejemplos; equipo excluido</text><text x="385" y="649" font-size="13" fill="#9EABBB">Prioridad 0,85–1,15 con mínimos</text><rect x="710" y="560" width="290" height="130" rx="10" fill="#11151c" stroke="#344052"/><text x="725" y="591" font-size="18">Recalibración CPU</text><text x="725" y="625" font-size="13" fill="#9EABBB">Propuesta con separación de datos</text><text x="725" y="649" font-size="13" fill="#9EABBB">Sin activación automática</text><rect x="1050" y="560" width="290" height="130" rx="10" fill="#11151c" stroke="#344052"/><text x="1065" y="591" font-size="18">Validación pendiente</text><text x="1065" y="625" font-size="13" fill="#9EABBB">Muestra humana representativa</text><text x="1065" y="649" font-size="13" fill="#9EABBB">Precisión industrial / IFC completos</text><path d="M320 165L365 165" stroke="#86AEE8" fill="none" marker-end="url(#a)"/><path d="M660 165L705 165" stroke="#86AEE8" fill="none" marker-end="url(#a)"/><path d="M1000 165L1045 165" stroke="#86AEE8" fill="none" marker-end="url(#a)"/><path d="M1195 230L1195 315" stroke="#86AEE8" fill="none" marker-end="url(#a)"/><path d="M1050 385L1005 385" stroke="#86AEE8" fill="none" marker-end="url(#a)"/><path d="M710 385L665 385" stroke="#86AEE8" fill="none" marker-end="url(#a)"/><path d="M370 385L325 385" stroke="#86AEE8" fill="none" marker-end="url(#a)"/><path d="M175 450L175 555" stroke="#86AEE8" fill="none" marker-end="url(#a)"/><path d="M320 625L365 625" stroke="#86AEE8" fill="none" marker-end="url(#a)"/><path d="M660 625L705 625" stroke="#86AEE8" fill="none" marker-end="url(#a)"/><path d="M1000 625L1045 625" stroke="#86AEE8" fill="none" marker-end="url(#a)"/><text x="30" y="745" font-size="14" fill="#9EABBB">Persistencia: Postgres + blobs SHA-256 · Cachés aisladas por despliegue · Reconciliación e IFC siguen siendo globales</text></g></svg>