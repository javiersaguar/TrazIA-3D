<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/media/brand.svg" type="image/svg+xml">
    <title>Comparar animaciones · TrazIA-3D</title>
    <style>
      :root { font: 14px system-ui, sans-serif; color-scheme: dark; background: #09090b; color: #f4f4f5; }
      body { margin: 0; min-height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
      header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 13px 16px; border-bottom: 1px solid #303138; }
      h1 { font-size: 16px; margin: 0; }
      button, select { font: inherit; padding: 5px 8px; }
      label { display: inline-flex; align-items: center; gap: 6px; }
      main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); min-height: 70vh; }
      section { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; }
      section + section { border-left: 1px solid #303138; }
      h2 { font-size: 13px; font-weight: 600; padding: 7px 12px; margin: 0; background: #15171d; }
      iframe { width: 100%; height: 100%; min-height: 62vh; border: 0; }
      @media (max-width: 850px) { main { grid-template-columns: 1fr; } section + section { border-left: 0; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Comparar animaciones</h1>
      <label>Escena <select id="scene"></select></label>
      <button type="button" id="repeat">Repetir (R)</button>
      <label><input type="checkbox" id="disable"> ?fx=0 en Actual</label>
      <span id="status" role="status"></span>
    </header>
    <main>
      <section><h2>Boceto</h2><iframe id="baseline" title="Pitch original" allow="fullscreen"></iframe></section>
      <section><h2>Actual</h2><iframe id="current" title="Pitch con efectos" allow="fullscreen"></iframe></section>
    </main>
    <script type="module" src="/src/compare.js"></script>
  </body>
</html>
