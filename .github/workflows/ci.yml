name: Checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --extra api
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run trazia export examples/vessel_rev_a.json --draft -o generated/rev_a.ifc
      - run: uv run trazia export examples/vessel_rev_b.json --draft -o generated/rev_b.ifc
      - run: uv run trazia diff examples/vessel_rev_a.json examples/vessel_rev_b.json -o generated/changes.json
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}
          path: generated/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm lint
      - run: corepack pnpm test:unit
      - run: corepack pnpm build
